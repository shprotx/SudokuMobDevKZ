name: Release APK

on:
  pull_request:
    branches: [ master ]
    types: [ closed ]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from build.gradle
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=?\s*"\K[^"]+' app/build.gradle)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASS: ${{ secrets.KEYSTORE_ALIAS_PASS }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          LEADERBOARD_CF_URL: ${{ secrets.LEADERBOARD_CF_URL }}
          FEEDBACK_API_URL: ${{ secrets.FEEDBACK_API_URL }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/sudoku-v${{ steps.version.outputs.name }}.apk

      - name: Extract release notes from PR body
        id: notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          NOTES=$(echo "$PR_BODY" | sed -n '/^## Что нового/,/^## /{ /^## Что нового/d; /^## /d; p; }')
          if [ -z "$NOTES" ]; then
            NOTES="Обновление до версии ${{ steps.version.outputs.name }}"
          fi
          {
            echo "body<<RELEASE_EOF"
            echo "$NOTES"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Судоку v${{ steps.version.outputs.name }}
          files: app/build/outputs/apk/release/sudoku-v${{ steps.version.outputs.name }}.apk
          body: ${{ steps.notes.outputs.body }}

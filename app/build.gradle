import com.github.triplet.gradle.androidpublisher.ReleaseStatus
import com.github.triplet.gradle.androidpublisher.ResolutionStrategy
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'com.github.triplet.play'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    compileSdk = 37

    defaultConfig {
        applicationId = "ru.shprot.sudokumobdevkz"
        minSdk = 29
        targetSdk = 37
        versionCode = 75
        versionName = "2.13.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "FIREBASE_DB_URL",
                "\"${localProperties.getProperty('FIREBASE_DB_URL', System.getenv('FIREBASE_DB_URL') ?: '')}\""
        buildConfigField "String", "FEEDBACK_API_URL",
                "\"${localProperties.getProperty('FEEDBACK_API_URL', System.getenv('FEEDBACK_API_URL') ?: '')}\""
        buildConfigField "String", "LEADERBOARD_CF_URL",
                "\"${localProperties.getProperty('LEADERBOARD_CF_URL', System.getenv('LEADERBOARD_CF_URL') ?: '')}\""
        buildConfigField "boolean", "IS_PRE_RELEASE", "${versionName.contains('-')}"
    }

    signingConfigs {
        release {
            storeFile = file(localProperties.getProperty('KEYSTORE_FILE', System.getenv('KEYSTORE_FILE') ?: 'keystore.jks').trim())
            storePassword = localProperties.getProperty('KEYSTORE_PASS', System.getenv('KEYSTORE_PASS') ?: '').trim()
            keyAlias = localProperties.getProperty('KEYSTORE_ALIAS', System.getenv('KEYSTORE_ALIAS') ?: '').trim()
            keyPassword = localProperties.getProperty('KEYSTORE_ALIAS_PASS', System.getenv('KEYSTORE_ALIAS_PASS') ?: '').trim()
        }
    }

    buildTypes {
        debug {
            debuggable = true
            minifyEnabled = false
        }
        release {
            signingConfig = signingConfigs.release
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }
    namespace = 'ru.shprot.sudokumobdevkz'
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

play {
    def saPath = localProperties.getProperty('PLAY_SERVICE_ACCOUNT_FILE', System.getenv('PLAY_SERVICE_ACCOUNT_FILE') ?: '').trim()
    if (saPath) {
        serviceAccountCredentials.set(file(saPath))
    } else {
        enabled.set(false)
    }
    defaultToAppBundles.set(true)
    track.set('internal')
    releaseStatus.set(ReleaseStatus.COMPLETED)
    resolutionStrategy.set(ResolutionStrategy.IGNORE)
    releaseName.set(android.defaultConfig.versionName)
}

dependencies {

    // --- Android core ---
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-ktx:1.16.0'

    // --- Compose BOM ---
    def composeBom = platform('androidx.compose:compose-bom:2025.05.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    // --- Activity / Lifecycle ---
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    def lifecycle_version = "2.9.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"

    // --- Navigation (Compose) ---
    def nav_version = "2.9.7"
    implementation "androidx.navigation:navigation-compose:$nav_version"

    // --- Room ---
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    androidTestImplementation "androidx.room:room-testing:$room_version"

    // --- Hilt ---
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-compiler:2.60.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'androidx.hilt:hilt-work:1.4.0'
    ksp 'androidx.hilt:hilt-compiler:1.4.0'

    // --- DataStore ---
    implementation 'androidx.datastore:datastore-preferences:1.1.7'

    // --- WorkManager (local notifications scheduling) ---
    implementation 'androidx.work:work-runtime-ktx:2.10.2'

    // --- Coroutines ---
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // --- Immutable Collections ---
    implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.8'

    // --- Retrofit + KotlinX Serialization ---
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0'

    // --- Google Play ---
    implementation 'com.google.android.play:review-ktx:2.0.2'
    implementation 'com.google.android.gms:play-services-base:18.10.0'
    implementation 'com.google.android.gms:play-services-games-v2:21.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    // --- Image loading (PGS avatars, leaderboard rows) ---
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // --- Color picker ---
    implementation 'com.github.skydoves:colorpicker-compose:1.1.2'

    // --- Drag-and-drop reorder (game layout editor) ---
    implementation 'sh.calvin.reorderable:reorderable:2.5.1'

    // --- Testing ---
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
